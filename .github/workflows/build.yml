name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore POE2Radar.slnx

      - name: Publish
        run: dotnet publish src/POE2Radar.Overlay/POE2Radar.Overlay.csproj -c Release -r win-x64 --self-contained true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: POE2Radar-ZH-win-x64
          path: src/POE2Radar.Overlay/bin/Release/net10.0-windows/win-x64/publish/
